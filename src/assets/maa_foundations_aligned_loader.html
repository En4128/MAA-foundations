
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@1,300&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .lw {
    min-height: 560px;
    background: #fdf8f2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    width: 100%;
  }

  .bg-rings {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: ringPulse ease-in-out infinite;
  }
  .r1 { width: 440px; height: 440px; border-color: rgba(212,164,76,0.10); animation-duration: 4s; }
  .r2 { width: 340px; height: 340px; border-color: rgba(212,164,76,0.16); animation-duration: 4s; animation-delay: 0.7s; }
  .r3 { width: 240px; height: 240px; border-color: rgba(212,164,76,0.22); animation-duration: 4s; animation-delay: 1.4s; }

  @keyframes ringPulse {
    0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.5; }
    50%      { transform: translate(-50%,-50%) scale(1.03); opacity: 1; }
  }

  .petal-orbit {
    position: absolute;
    top: 50%; left: 50%;
    width: 340px; height: 340px;
    margin-left: -170px; margin-top: -170px;
    animation: orbitSpin 20s linear infinite;
    pointer-events: none;
  }
  @keyframes orbitSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  .center-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .emblem-wrap {
    width: 180px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand-name {
    font-family: 'Cinzel', serif;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.28em;
    color: #5a3e1b;
    text-align: center;
    margin-top: 10px;
    white-space: nowrap;
    animation: fadeUp 1.2s ease forwards;
    opacity: 0;
    animation-delay: 0.5s;
  }

  .brand-tag {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.16em;
    color: #b8936a;
    text-align: center;
    margin-top: 6px;
    animation: fadeUp 1.2s ease forwards;
    opacity: 0;
    animation-delay: 0.9s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
    width: 160px;
    animation: fadeUp 1s ease forwards;
    opacity: 0;
    animation-delay: 1.1s;
  }
  .div-line { flex: 1; height: 0.5px; background: #c9a06a; }
  .div-diamond { width: 5px; height: 5px; background: #c9a06a; transform: rotate(45deg); flex-shrink: 0; }

  .shimmer-bar {
    width: 160px;
    height: 2px;
    background: rgba(200,155,80,0.18);
    border-radius: 2px;
    margin-top: 14px;
    overflow: hidden;
    animation: fadeUp 1s ease forwards;
    opacity: 0;
    animation-delay: 1.3s;
  }
  .shimmer-fill {
    height: 100%;
    width: 40%;
    background: #d4a44c;
    border-radius: 2px;
    animation: shimmerMove 2.2s ease-in-out infinite;
    animation-delay: 1.5s;
  }
  @keyframes shimmerMove {
    0%   { transform: translateX(-200%); }
    100% { transform: translateX(400%); }
  }

  .dots-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    animation: fadeUp 1s ease forwards;
    opacity: 0;
    animation-delay: 1.5s;
  }
  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #e8c08a;
    animation: dotBounce 1.6s ease-in-out infinite;
  }
  .dot:nth-child(1){animation-delay:0s}
  .dot:nth-child(2){animation-delay:0.2s}
  .dot:nth-child(3){animation-delay:0.4s}
  .dot:nth-child(4){animation-delay:0.6s}
  .dot:nth-child(5){animation-delay:0.8s}

  @keyframes dotBounce {
    0%,100% { transform: scaleY(1); opacity: 0.4; background: #e8c08a; }
    50%      { transform: scaleY(1.9); opacity: 1; background: #b87a2a; }
  }

  .leaf { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; animation: leafRise linear infinite; }
  @keyframes leafRise {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.45; }
    90%  { opacity: 0.15; }
    100% { transform: translateY(-520px) rotate(200deg); opacity: 0; }
  }
</style>

    <svg class="petal-orbit" viewBox="0 0 340 340" fill="none">
      <g opacity="0.15">

        <ellipse cx="170" cy="38"  rx="9" ry="20" fill="#d4a44c" transform="rotate(30  170 170)"/>

        <ellipse cx="170" cy="38"  rx="9" ry="20" fill="#d4a44c" transform="rotate(240 170 170)"/>
        <ellipse cx="170" cy="38"  rx="9" ry="20" fill="#d4a44c" transform="rotate(270 170 170)"/>

        <ellipse cx="90" cy="58"  rx="7" ry="19" fill="url(#gA)" opacity="0.9" transform="rotate(80  90 90)"/>
        <ellipse cx="90" cy="58"  rx="7" ry="19" fill="url(#gA)" opacity="0.9" transform="rotate(120 90 90)"/>
        <ellipse cx="90" cy="58"  rx="7" ry="19" fill="url(#gA)" opacity="0.9" transform="rotate(160 90 90)"/>
        <ellipse cx="90" cy="58"  rx="7" ry="19" fill="url(#gA)" opacity="0.9" transform="rotate(200 90 90)"/>
        <ellipse cx="90" cy="58"  rx="7" ry="19" fill="url(#gA)" opacity="0.9" transform="rotate(240 90 90)"/>
        <ellipse cx="90" cy="58"  rx="7" ry="19" fill="url(#gA)" opacity="0.9" transform="rotate(280 90 90)"/>
        <ellipse cx="90" cy="58"  rx="7" ry="19" fill="url(#gA)" opacity="0.9" transform="rotate(320 90 90)"/>

        <ellipse cx="90" cy="66"  rx="5" ry="13" fill="#f5deb0" opacity="0.65"/>
        <ellipse cx="90" cy="66"  rx="5" ry="13" fill="#f5deb0" opacity="0.65" transform="rotate(45  90 90)"/>
        <ellipse cx="90" cy="66"  rx="5" ry="13" fill="#f5deb0" opacity="0.65" transform="rotate(90  90 90)"/>

        <circle cx="90" cy="90" r="13" fill="url(#gB)" opacity="0.95"/>
        <circle cx="90" cy="90" r="9"  fill="#fdf4e3"/>
        <circle cx="90" cy="90" r="4"  fill="url(#gA)"/>

        <circle cx="90" cy="90" r="13" fill="none" stroke="#d4a44c" stroke-width="0.6" opacity="0.6">
          <animate attributeName="r"       values="13;22;13" dur="2.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0;0.6" dur="2.8s" repeatCount="indefinite"/>
        </circle>

        <line x1="42" y1="138" x2="56" y2="128" stroke="url(#gA)" stroke-width="1"   stroke-linecap="round"/>
        <line x1="138" y1="138" x2="124" y2="128" stroke="url(#gA)" stroke-width="1" stroke-linecap="round"/>

        <path d="M42 142 L90 156 L138 142" stroke="url(#gA)" stroke-width="1" fill="none" opacity="0.55"/>

        <rect x="58" y="156" width="64" height="7" rx="1" fill="none" stroke="url(#gA)" stroke-width="0.6" opacity="0.45"/>
        <rect x="65" y="153" width="50" height="3" rx="1" fill="url(#gA)" opacity="0.28"/>

        <line x1="78" y1="34" x2="90" y2="20" stroke="#d4a44c" stroke-width="0.8" stroke-linecap="round" opacity="0.55"/>
        <line x1="102" y1="34" x2="90" y2="20" stroke="#d4a44c" stroke-width="0.8" stroke-linecap="round" opacity="0.55"/>
        <circle cx="90" cy="19" r="3" fill="#d4a44c" opacity="0.7"/>
      </svg>
    </div>

    <div class="brand-name">MAA-FOUNDATIONS</div>
    <div class="brand-tag">Where Every Moment Blooms</div>

    <div class="divider">
      <div class="div-line"></div>
      <div class="div-diamond"></div>
      <div class="div-line"></div>
    </div>

    <div class="shimmer-bar">
      <div class="shimmer-fill"></div>
    </div>

    <div class="dots-row">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</div>

<script>
  const lc = document.getElementById('leaves-container');
  const cols = ['#e8c06a','#d4a44c','#f0d090','#c8954a','#f5deb0'];
  for (let i = 0; i < 16; i++) {
    const el = document.createElement('div');
    el.className = 'leaf';
    const s = 4 + Math.random() * 5;
    el.style.cssText = `
      width:${s}px;height:${s}px;
      left:${5 + Math.random()*90}%;
      bottom:${Math.random()*10}%;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      border-radius:${Math.random()>0.5?'50%':'2px'};
      animation-duration:${6+Math.random()*8}s;
      animation-delay:${Math.random()*7}s;
    `;
    lc.appendChild(el);
  }
</script>
